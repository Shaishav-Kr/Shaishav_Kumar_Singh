artifacts = ["/app/report.json"]

[task]
name = "dynamo/log-report"
description = "Parse an Apache-style access log into a JSON summary report with request count, unique-IP count, and top path."

[metadata]
category = "data_processing_and_etl"
subcategory = "text_processing"
task_objective = ["transform", "generate"]
artifact_type = ["generated_output_artifact"]
expert_time_estimate_hours = 0.3
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "Requires parsing a standard Apache Combined Log Format file, aggregating counts, and serialising to JSON — straightforward scripting with no external dependencies."
solution_explanation = "Read /app/access.log line-by-line; extract the client IP from field 0, the request path from the quoted method line, tally totals, then write {total_requests, unique_ips, top_path} to /app/report.json."
verification_explanation = "Verifier parses /app/report.json and asserts total_requests==6, unique_ips==3, and top_path=='/index.html' against the known ground-truth values derived from the fixed access.log."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

